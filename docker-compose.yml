# findmy: the coming soon page runs on its own by default.
# Enable the dashboard profile to start fm-server and use the full app.
#
#   docker compose up -d --build
#   FM_ADMIN_PASSWORD=... VITE_COMING_SOON=false docker compose --profile dashboard up -d --build
#
# Only the client's port is published. FINDMY_PORT changes the web port.

services:
  server:
    profiles:
      - dashboard
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    container_name: findmy-server
    environment:
      - FM_ADMIN_PASSWORD=${FM_ADMIN_PASSWORD:-}
      - FM_MASTER_KEY=${FM_MASTER_KEY:-}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - findmy-data:/data
    networks:
      - findmy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "fm-server", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_COMING_SOON: ${VITE_COMING_SOON:-true}
    container_name: findmy-client
    ports:
      - "${FINDMY_PORT:-8080}:80"
    networks:
      - findmy-network
    restart: unless-stopped

volumes:
  findmy-data:

networks:
  findmy-network:
    driver: bridge
